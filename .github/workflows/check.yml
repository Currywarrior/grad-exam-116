name: 檢查各校簡章

on:
  schedule:
    - cron: "0 1 * * *"   # 每天台灣時間 09:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 pypdf==5.1.0 requests==2.32.3
      - run: python -m playwright install --with-deps chromium
      - run: python check.py
      - name: 有變動就 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update schedule data" && git push
